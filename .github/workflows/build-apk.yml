name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Generate Keystore & Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass 123456 -keypass 123456 -dname "CN=Ameer Hamza, OU=Dev, O=HamzaYT, L=Agra, S=UP, C=IN"
          ./gradlew assembleRelease
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release-key.jks -storepass 123456 -keypass 123456 app/build/outputs/apk/release/app-release-unsigned.apk my-key-alias
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/CarJamSolver-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CarJamSolver-Signed-APK
          path: android/app/build/outputs/apk/release/CarJamSolver-signed.apk